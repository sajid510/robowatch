<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="1" stop-color="#12122a"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e94560"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a35"/>
      <stop offset="1" stop-color="#161630"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7ec8e3"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="70" fill="url(#hl)" opacity="0.9"/>
  <text x="40" y="44" font-size="26" font-weight="700" fill="#fff">RoboWatch — Weekly Robotics Intelligence Pipeline</text>
  <text x="40" y="62" font-size="13" fill="#d8d8f0" opacity="0.85">RSS × AI filter (Groq) × enrichment (Groq) × narrative (Gemini) × email delivery</text>

  <!-- Stage 1: Sources -->
  <rect x="30" y="120" width="150" height="200" rx="10" fill="url(#box)" stroke="#333" stroke-width="1.5"/>
  <text x="105" y="150" font-size="15" font-weight="700" fill="#7ec8e3" text-anchor="middle">DATA SOURCES</text>
  <text x="105" y="178" font-size="12" fill="#aaa" text-anchor="middle">config/sources.yaml</text>
  <text x="105" y="202" font-size="11" fill="#888" text-anchor="middle">7 feed groups:</text>
  <text x="105" y="220" font-size="11" fill="#888" text-anchor="middle">industry · research</text>
  <text x="105" y="238" font-size="11" fill="#888" text-anchor="middle">competitions · fellowships</text>
  <text x="105" y="256" font-size="11" fill="#888" text-anchor="middle">conferences · BD · CFP</text>
  <text x="105" y="286" font-size="11" fill="#5f5f8a" text-anchor="middle">IEEE Spectrum, arXiv,</text>
  <text x="105" y="302" font-size="11" fill="#5f5f8a" text-anchor="middle">Devpost, Google News</text>

  <!-- CFP tracker -->
  <rect x="30" y="350" width="150" height="110" rx="10" fill="url(#box)" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="105" y="380" font-size="13" font-weight="700" fill="#9b59b6" text-anchor="middle">CFP TRACKER</text>
  <text x="105" y="402" font-size="11" fill="#aaa" text-anchor="middle">12 target conferences</text>
  <text x="105" y="420" font-size="11" fill="#aaa" text-anchor="middle">ICRA · IROS · ROBIO</text>
  <text x="105" y="438" font-size="11" fill="#aaa" text-anchor="middle">ROSCon · RAAICON</text>

  <!-- Stage 2: Fetch -->
  <rect x="230" y="150" width="150" height="140" rx="10" fill="url(#box)" stroke="#333" stroke-width="1.5"/>
  <text x="305" y="185" font-size="15" font-weight="700" fill="#7ec8e3" text-anchor="middle">FETCH</text>
  <text x="305" y="210" font-size="11" fill="#aaa" text-anchor="middle">feedparser RSS pull</text>
  <text x="305" y="228" font-size="11" fill="#aaa" text-anchor="middle">normalize + clean HTML</text>
  <text x="305" y="246" font-size="11" fill="#aaa" text-anchor="middle">dedupe by URL / title</text>
  <text x="305" y="264" font-size="11" fill="#aaa" text-anchor="middle">8-day recency filter</text>

  <!-- Stage 3: AI filter -->
  <rect x="430" y="150" width="150" height="140" rx="10" fill="url(#box)" stroke="#333" stroke-width="1.5"/>
  <text x="505" y="185" font-size="15" font-weight="700" fill="#7ec8e3" text-anchor="middle">AI FILTER</text>
  <text x="505" y="212" font-size="11" fill="#aaa" text-anchor="middle">Groq llama-3.3-70b</text>
  <text x="505" y="230" font-size="11" fill="#aaa" text-anchor="middle">relevance scoring per item</text>
  <text x="505" y="248" font-size="11" fill="#aaa" text-anchor="middle">drops off-topic / spam</text>

  <!-- Stage 4: Enrich -->
  <rect x="630" y="150" width="150" height="140" rx="10" fill="url(#box)" stroke="#333" stroke-width="1.5"/>
  <text x="705" y="185" font-size="15" font-weight="700" fill="#7ec8e3" text-anchor="middle">ENRICH</text>
  <text x="705" y="212" font-size="11" fill="#aaa" text-anchor="middle">summary · score /10</text>
  <text x="705" y="230" font-size="11" fill="#aaa" text-anchor="middle">priority · deadline</text>
  <text x="705" y="248" font-size="11" fill="#aaa" text-anchor="middle">BD relevance · key tech</text>

  <!-- Stage 5: Narrator -->
  <rect x="830" y="150" width="150" height="140" rx="10" fill="url(#box)" stroke="#333" stroke-width="1.5"/>
  <text x="905" y="185" font-size="15" font-weight="700" fill="#7ec8e3" text-anchor="middle">NARRATE</text>
  <text x="905" y="212" font-size="11" fill="#aaa" text-anchor="middle">Gemini 2.5 Flash</text>
  <text x="905" y="230" font-size="11" fill="#aaa" text-anchor="middle">9-section HTML report</text>
  <text x="905" y="248" font-size="11" fill="#aaa" text-anchor="middle">fallback template on fail</text>

  <!-- Stage 6: Deliver -->
  <rect x="1030" y="150" width="140" height="140" rx="10" fill="url(#box)" stroke="#27ae60" stroke-width="1.5"/>
  <text x="1100" y="185" font-size="15" font-weight="700" fill="#2ecc71" text-anchor="middle">DELIVER</text>
  <text x="1100" y="212" font-size="11" fill="#aaa" text-anchor="middle">Gmail SMTP (TLS)</text>
  <text x="1100" y="230" font-size="11" fill="#aaa" text-anchor="middle">subscribers.txt list</text>
  <text x="1100" y="248" font-size="11" fill="#aaa" text-anchor="middle">dry-run → report.html</text>

  <!-- CFP branch -->
  <path d="M180 405 L230 405 L230 235" stroke="#9b59b6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Main arrows -->
  <path d="M180 220 L230 220" stroke="#7ec8e3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M380 220 L430 220" stroke="#7ec8e3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M580 220 L630 220" stroke="#7ec8e3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M780 220 L830 220" stroke="#7ec8e3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M980 220 L1030 220" stroke="#7ec8e3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Scheduler -->
  <rect x="230" y="470" width="260" height="90" rx="10" fill="url(#box)" stroke="#f5a623" stroke-width="1.5"/>
  <text x="360" y="500" font-size="14" font-weight="700" fill="#f5a623" text-anchor="middle">ORCHESTRATION</text>
  <text x="360" y="524" font-size="11" fill="#aaa" text-anchor="middle">GitHub Actions cron — Friday 08:00 UTC</text>
  <text x="360" y="542" font-size="11" fill="#aaa" text-anchor="middle">secrets: GROQ / GEMINI / GMAIL</text>
  <path d="M360 470 L360 290" stroke="#f5a623" stroke-width="2" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow)"/>

  <!-- Local/CI -->
  <rect x="560" y="470" width="300" height="90" rx="10" fill="url(#box)" stroke="#333" stroke-width="1.5"/>
  <text x="710" y="500" font-size="14" font-weight="700" fill="#7ec8e3" text-anchor="middle">RUN MODES</text>
  <text x="710" y="524" font-size="11" fill="#aaa" text-anchor="middle">--offline  sample data · no network</text>
  <text x="710" y="542" font-size="11" fill="#aaa" text-anchor="middle">--dry-run   report.html + stats.json</text>
  <text x="710" y="560" font-size="11" fill="#aaa" text-anchor="middle">--send      deliver to subscribers</text>

  <text x="40" y="620" font-size="12" fill="#5f5f8a">RoboWatch · Python 3.10+ · feedparser · httpx · jinja2 · pytest · GitHub Actions</text>
</svg>
